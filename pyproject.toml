[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgex-cli"
dynamic = ["version"]
description = "FORGEX — multi-agent AI software engineering. Plan. Build. Refine. Verify."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FORGEX Contributors" }]
keywords = ["ai", "agents", "cli", "llm", "software-engineering", "automation", "groq", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.0",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "tomli-w>=1.0",
    "httpx>=0.27",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.2",
]

[project.scripts]
forgex = "forgex.cli.app:main"

[project.urls]
Homepage = "https://github.com/B-max12/Forgex"
Repository = "https://github.com/B-max12/Forgex"
Issues = "https://github.com/B-max12/Forgex/issues"
Changelog = "https://github.com/B-max12/Forgex/blob/main/CHANGELOG.md"
Documentation = "https://github.com/B-max12/Forgex/tree/main/docs"

[tool.hatch.version]
path = "src/forgex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/forgex"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/SECURITY.md",
    "/.github",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "W",
]
ignore = [
    "E501",   # Line length handled/ignored where long prompts exist
    "F841",   # Local variable assigned but unused in tests/fixtures
    "B008",   # Do not perform function call in argument defaults (typer)
    "B904",   # Within an except clause, raise exceptions with raise ... from err
    "B006",   # Do not use mutable data structures for argument defaults
    "B010",   # setattr with constant attribute name
    "W291",   # Trailing whitespace (ASCII art banners)
    "W293",   # Blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "B", "W", "E"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
