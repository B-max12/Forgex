<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Home Page Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #fff;
        }
        .header {
            display: flex;
            justify-content: flex-end;
            padding: 15px 30px;
            width: 100%;
        }
        .header-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .header-links a {
            color: #1f1f1f;
            text-decoration: none;
            font-size: 13px;
        }
        .header-links a:hover {
            text-decoration: underline;
        }
        .apps-icon, .signin-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .apps-icon:hover {
            background-color: #f0f0f0;
        }
        .signin-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            font-size: 14px;
            font-weight: bold;
            padding: 0 15px;
            border-radius: 4px;
            height: 36px;
            cursor: pointer;
        }
        .signin-btn:hover {
            background-color: #1557b0;
        }
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 100px;
        }
        .logo {
            margin-bottom: 30px;
        }
        .logo img {
            height: 92px;
        }
        .search-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .search-box {
            display: flex;
            align-items: center;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 15px;
            width: 582px;
            height: 44px;
            box-shadow: none;
        }
        .search-box:hover, .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }
        .search-icon {
            color: #9aa0a6;
            margin-right: 10px;
        }
        .search-input {
            border: none;
            outline: none;
            font-size: 16px;
            flex: 1;
            color: #202124;
        }
        .mic-icon {
            color: #4285f4;
            margin-left: 10px;
            cursor: pointer;
        }
        .buttons {
            display: flex;
            gap: 12px;
        }
        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .btn:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            color: #202124;
        }
        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: #f2f2f2;
            border-top: 1px solid #e4e4e4;
        }
        .footer-links {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            font-size: 14px;
            color: #70757a;
        }
        .footer-links a {
            color: #70757a;
            text-decoration: none;
            margin-left: 27px;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        .footer-left, .footer-right {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-links">
            <a href="#">About</a>
            <a href="#">Store</a>
            <div class="apps-icon" title="Google apps">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="6" height="6" rx="1"/>
                    <rect x="15" y="3" width="6" height="6" rx="1"/>
                    <rect x="3" y="15" width="6" height="6" rx="1"/>
                    <rect x="15" y="15" width="6" height="6" rx="1"/>
                </svg>
            </div>
            <button class="signin-btn">Sign in</button>
        </div>
    </div>
    
    <div class="main-content">
        <div class="logo">
            <svg width="272" height="92" viewBox="0 0 272 92" fill="none" xmlns="http://www.w3.org/2000/svg">
                <text x="0" y="75" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#4285f4">G</text>
                <text x="65" y="75" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ea4335">o</text>
                <text x="115" y="75" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#fbbc05">o</text>
                <text x="165" y="75" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#4285f4">g</text>
                <text x="210" y="75" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#34a853">l</text>
                <text x="245" y="75" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ea4335">e</text>
            </svg>
        </div>
        
        <div class="search-container">
            <div class="search-box">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" class="search-input" placeholder="Search Google or type a URL" autocomplete="off">
                <svg class="mic-icon" width="24" height="24" viewBox="0 0 24 24" fill="#4285f4">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5.1c0 4.04 3.5 7.5 7.9 7.5s7.9-3.46 7.9-7.5h-1.6zM12 16c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
            </div>
            <div class="buttons">
                <button class="btn">Google Search</button>
                <button class="btn">I'm Feeling Lucky</button>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <div class="footer-links">
            <div class="footer-left">
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div class="footer-right">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </div>
</body>
</html>
